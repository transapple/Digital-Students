<style>
/* ---------- Design tokens (theme colors are set from JS) ---------- */
:root{
  --bg:#f3f5f9;--surface:#fff;--surface-2:#f7f8fb;--text:#141b2d;--muted:#64708a;--line:#e3e7ef;
  --brand:#4f46e5;--primary:#4f46e5;--on-primary:#fff;
  --ok:#0f8f62;--warn:#b86e00;--bad:#d62839;
  --radius:14px;--radius-sm:10px;--pad:22px;--gap:18px;--row:13px;--fs:1;--sidebar-w:268px;
  --shadow:0 1px 2px rgba(20,27,45,.04),0 10px 30px rgba(20,27,45,.06);
  --primary-soft:color-mix(in srgb,var(--primary) 11%,var(--surface));
  --primary-line:color-mix(in srgb,var(--primary) 32%,var(--line));
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-mode=dark]{
  --bg:#0b101c;--surface:#131a2b;--surface-2:#182137;--text:#e7ebf5;--muted:#93a0bb;--line:#26314b;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{font-size:calc(15px * var(--fs));scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1{font-size:1.75rem;line-height:1.2;letter-spacing:-.02em;margin:0}
h2{font-size:1.05rem;margin:0;line-height:1.3}
p{margin:0;color:var(--muted)}
.sm{font-size:.82rem;color:var(--muted)}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:40;transition:width .2s,transform .25s;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 20px}
.brand-mark{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none;overflow:hidden}
.brand-text b{display:block;font-size:1.02rem;line-height:1.1}
.brand-text small{color:var(--muted);font-size:.74rem}
.me{display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.me b{display:block;font-size:.86rem;line-height:1.25}
.me small{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.avatar{width:38px;height:38px;border-radius:calc(var(--radius-sm) + 2px);background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.85rem;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav-title{font-size:.74rem;color:var(--muted);padding:16px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);font-size:.88rem;font-weight:500;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-item.active:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-item.danger{color:var(--bad)}
.nav-item.danger:hover{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.nav-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.side-scrim{display:none}

/* ---------- Main + topbar ---------- */
.main{margin-left:var(--sidebar-w);transition:margin .2s;min-width:0}
.topbar{position:sticky;top:0;z-index:30;height:66px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--text);font-size:.95rem}
.crumb svg{width:14px;height:14px}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:10px;flex:1;max-width:340px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);font-size:.85rem;text-align:left}
.search-btn:hover{border-color:var(--primary-line)}
kbd{margin-left:auto;font:500 .7rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.tb-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.icon-btn:hover{color:var(--text);border-color:var(--primary-line)}
.icon-btn .avatar{width:100%;height:100%;border-radius:0}
.badge-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.menu-btn{display:none}
.pop-title{font-weight:700;font-size:.92rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.menu-link{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--radius-sm);font-size:.87rem;color:var(--text);text-align:left}
.menu-link:hover{background:var(--surface-2)}
.note{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);font-size:.84rem}
.note:first-of-type,.modal-head+.note{border-top:0}
.note b{display:block}.note small{color:var(--muted)}
.note .tl-dot{margin-top:6px}

/* ---------- Content + layout ---------- */
.content{padding:28px;max-width:1240px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head p{margin-top:6px;max-width:62ch}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:var(--gap)}
.cols-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.cols-main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-profile{grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);align-items:start}
.stack{display:grid;gap:var(--gap)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.panel-head p{font-size:.82rem;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.82rem;color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);background:var(--primary);color:var(--on-primary);font-weight:700;font-size:.85rem;transition:filter .15s,border-color .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--primary-line);filter:none}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:.8rem}

/* ---------- Student ID card ---------- */
.idcard{position:relative;overflow:hidden;color:#fff;border-radius:calc(var(--radius) + 6px);padding:24px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 74%,#000),var(--brand) 60%,color-mix(in srgb,var(--brand) 72%,#fff));box-shadow:0 18px 40px color-mix(in srgb,var(--brand) 32%,transparent)}
.idcard:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 112% -12%,transparent 0 14px,rgba(255,255,255,.075) 14px 15px);pointer-events:none}
.idcard>*{position:relative}
.id-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;gap:10px}
.id-top .brand-mark{width:30px;height:30px;font-size:.9rem;background:rgba(255,255,255,.2)}
.id-logo{display:flex;gap:10px;align-items:center}
.id-body{display:flex;gap:16px;align-items:center}
.id-photo{width:76px;height:92px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:1.6rem;font-weight:800;overflow:hidden;flex:none}
.id-photo img{width:100%;height:100%;object-fit:cover}
.id-name{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.id-sub{opacity:.86;font-size:.84rem;margin-top:3px}
.id-num{font-family:var(--mono);font-size:1.6rem;letter-spacing:.14em;font-weight:500;word-break:break-all}
.id-label{font-size:.76rem;opacity:.82}
.id-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.verified{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:.76rem;font-weight:700}
.verified svg{width:14px;height:14px}
.id-copy{color:#fff;background:rgba(255,255,255,.18);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.id-copy:hover{background:rgba(255,255,255,.3)}
.id-inline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px dashed var(--primary-line);background:var(--primary-soft);border-radius:var(--radius-sm)}
.id-inline .mono{font-size:1.1rem;font-weight:500;color:var(--primary)}

/* ---------- Stats, rows, meters ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:var(--pad);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat:nth-child(2n){border-right:0}
.stat:nth-last-child(-n+2){border-bottom:0}
.stat small{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:8px}
.stat small svg{color:var(--primary)}
.stat strong{display:block;font-size:1.9rem;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.1}
.delta{font-size:.8rem;color:var(--ok);font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:var(--row) 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row-ico{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.row-main{flex:1;min-width:0}
.row-main b{font-size:.9rem;display:block}
.row-main small{color:var(--muted);font-size:.8rem}
.row-end{text-align:right}
.row-end small{display:block;color:var(--muted);font-size:.78rem}
.meter{height:7px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:7px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--primary);border-radius:9px}
.trend{width:100%;height:auto;display:block}
.tl-item{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item:not(:last-child):before{content:"";position:absolute;left:5px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--primary-soft)}
.tl-item b{font-size:.88rem;display:block}
.tl-item small{display:block;color:var(--muted);font-size:.8rem}

/* ---------- Tables, badges ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:var(--row) 12px;border-bottom:1px solid var(--line);font-size:.87rem}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.badge.pending{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.off{background:var(--surface-2);color:var(--muted)}
.mono{font-family:var(--mono);letter-spacing:.06em}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* ---------- Forms ---------- */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.field .val{padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);font-weight:600;font-size:.9rem;min-height:44px;word-break:break-word}
.input{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
input[type=range]{accent-color:var(--primary);width:170px}
.sect{font-size:.95rem;margin:22px 0 12px}
.sect:first-child{margin-top:0}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting b{font-size:.9rem;display:block}
.setting small{color:var(--muted);font-size:.82rem;display:block}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]:after{transform:translateX(18px)}
.seg{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:calc(var(--radius-sm) + 4px);background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.swatch{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:.85rem;font-weight:600;text-align:left}
.swatch:hover{border-color:var(--c)}
.swatch i{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;flex:none}
.swatch i svg,.dot svg{width:14px;height:14px;opacity:0}
.swatch[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 24%,transparent)}
.swatch[aria-pressed=true] i svg,.dot[aria-pressed=true] svg{opacity:1}
.dots{display:flex;gap:9px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dot[aria-pressed=true]{box-shadow:0 0 0 2px var(--c)}
.preview{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.settings{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--gap);align-items:start}
.subnav{display:grid;gap:4px;position:sticky;top:86px}
.subnav .nav-item{padding:11px 12px}
.subnav .nav-item.active:before{display:none}

/* ---------- Profile ---------- */
.avatar-lg{position:relative;width:96px;height:96px;flex:none}
.avatar-lg .avatar{width:96px;height:96px;font-size:1.8rem;border-radius:calc(var(--radius) + 6px)}
.avatar-lg label{position:absolute;right:-6px;bottom:-6px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;border:3px solid var(--surface)}
.avatar-lg label svg{width:16px;height:16px}
.avatar-lg input{position:absolute;opacity:0;width:0;height:0}
.avatar-lg input:focus-visible+svg{outline:2px solid var(--primary)}
.who{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.who h2{font-size:1.25rem}
.faq details{border-top:1px solid var(--line);padding:14px 0}
.faq details:first-child{border-top:0}
.faq summary{cursor:pointer;font-weight:600;font-size:.92rem}
.faq p{margin-top:8px;font-size:.87rem}

/* ---------- Modal, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.scrim.open{display:flex}
.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;margin:auto;background:var(--surface);border-radius:calc(var(--radius) + 4px);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4);padding:22px}
.modal.sm{width:min(400px,100%)}
.scrim.open .modal{animation:pop-in .16s ease-out}
@keyframes pop-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.more-grid .menu-link{border:1px solid var(--line);padding:12px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-head p{font-size:.85rem;margin-top:4px}
.modal-body{display:grid;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.check{display:flex;align-items:center;gap:10px;font-size:.88rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm)}
.check input{accent-color:var(--primary);width:17px;height:17px}
.pal-list{display:grid;gap:2px;margin-top:10px;max-height:320px;overflow:auto}
.pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);text-align:left;font-size:.9rem;width:100%}
.pal-item:hover,.pal-item.first{background:var(--primary-soft);color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Compact sidebar (desktop only) ---------- */
@media(min-width:1001px){
  html[data-sidebar=compact]{--sidebar-w:82px}
  html[data-sidebar=compact] .lbl,html[data-sidebar=compact] .nav-title,html[data-sidebar=compact] .brand-text,html[data-sidebar=compact] .me-text{display:none}
  html[data-sidebar=compact] .nav-item,html[data-sidebar=compact] .me,html[data-sidebar=compact] .brand{justify-content:center}
  html[data-sidebar=compact] .nav-item{padding:12px 0}
  html[data-sidebar=compact] .nav-item.active:before{left:-14px}
  html[data-sidebar=compact] .nav-title{display:block;height:8px;padding:0;font-size:0}
}

/* ---------- Navigation layout: bottom bar ---------- */
.bottomnav{display:none;position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:45;padding:6px;gap:4px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:calc(var(--radius) + 8px);box-shadow:0 12px 36px rgba(20,27,45,.18)}
.bn-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;border-radius:calc(var(--radius) + 2px);color:var(--muted);font-size:.7rem;font-weight:600;line-height:1.2;transition:background .15s,color .15s}
.bn-item svg.i{width:22px;height:22px}
.bn-item:hover{color:var(--text)}
.bn-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.bn-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-brand{display:none}
html[data-nav=bottom] .sidebar,html[data-nav=bottom] .side-scrim{display:none!important}
html[data-nav=bottom] .main{margin-left:0}
html[data-nav=bottom] .menu-btn{display:none!important}
html[data-nav=bottom] .bottomnav{display:flex}
html[data-nav=bottom] .tb-brand{display:grid;width:34px;height:34px;font-size:1rem}
html[data-nav=bottom] .content{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
html[data-nav=bottom] .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.layouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.layout{display:grid;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:left;align-content:start}
.layout:hover{border-color:var(--primary-line)}
.layout[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.lay-art{display:block;position:relative;height:78px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden}
.lay-art:before,.lay-art:after{content:"";position:absolute}
.lay-side:before{left:0;top:0;bottom:0;width:26%;background:var(--primary);opacity:.9}
.lay-side:after,.lay-bottom:after{left:34%;right:10%;top:14px;height:9px;border-radius:5px;background:var(--line);box-shadow:0 17px 0 var(--line),0 34px 0 var(--line)}
.lay-bottom:before{left:20%;right:20%;bottom:8px;height:16px;border-radius:9px;background:var(--primary);opacity:.9}
.lay-bottom:after{left:10%}
.lay-t{display:block;font-weight:700;font-size:.9rem}
.lay-t small{display:block;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:2px}

/* ---------- Responsive ---------- */
@media(max-width:1000px){
  .sidebar{transform:translateX(-100%);width:284px}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .side-scrim.open{display:block;position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .search-btn{flex:0 0 40px;padding:0;justify-content:center;max-width:none}
  .search-btn .search-label,.search-btn kbd{display:none}
  .cols-hero,.cols-main,.cols-2,.cols-profile,.settings{grid-template-columns:1fr}
  .subnav{position:static;grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .content{padding:18px 14px}
  .topbar{padding:0 14px;gap:10px}
  .crumb>span,.crumb>svg{display:none}
  h1{font-size:1.4rem}
  .fields{grid-template-columns:1fr}
  .id-num{font-size:1.2rem}
  .stat strong{font-size:1.5rem}
  .setting{flex-wrap:wrap}
  .tb-actions{gap:6px}
  .layouts{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Auth screen ---------- */
body.pre-auth .app,body.pre-auth .bottomnav{display:none!important}
body:not(.pre-auth) #authScreen{display:none!important}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-tabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}
.auth-tabs button{flex:1;height:36px;border-radius:calc(var(--radius-sm) - 2px);font-size:.85rem;font-weight:700;color:var(--muted)}
.auth-tabs button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.auth-err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-radius:var(--radius-sm);padding:10px 12px;font-size:.83rem;font-weight:600;margin-bottom:14px}
.auth-card .field{margin-bottom:14px}
.auth-card .btn{width:100%;height:44px}
.auth-foot{margin-top:16px;text-align:center}
</style>
</head>

}
function pct(r) { const m = Number(r.max_marks); return m > 0 ? Math.round((Number(r.marks_obtained) / m) * 100) : 0; }
function resultsAsRows() {
  return RESULTS.map(r => [r.subject_name || "Subject", pct(r), r.remarks || ""]);
}
function termAverages() {
  const order = [], sums = {};
  RESULTS.forEach(r => {
    const t = r.term_name || "Unspecified term";
    if (!(t in sums)) { sums[t] = { total: 0, n: 0 }; order.push(t); }
    sums[t].total += pct(r); sums[t].n++;
  });
  return { labels: order, vals: order.map(t => Math.round(sums[t].total / sums[t].n)) };
}

async function loadAll() {
  const [res, sch, note, app, auth, priv] = await Promise.all([
    sbRpc("list_student_exam_results", { p_token: TOKEN }),
    sbRpc("list_student_schools", { p_token: TOKEN }),
    sbRpc("list_student_notifications", { p_token: TOKEN }),
    sbRpc("list_student_applications", { p_token: TOKEN }),
    sbRpc("list_student_authorizations", { p_token: TOKEN }),
    sbRpc("student_privacy_state", { p_token: TOKEN })
  ]);
  RESULTS = (res && res.results) || [];
  SCHOOLS_LIST = (sch && sch.schools) || [];
  NOTES = (note && note.notifications) || [];
  APPS_LIST = (app && app.applications) || [];
  AUTHS_LIST = (auth && auth.authorizations) || [];
  PRIVACY = priv && priv.success ? priv : null;
  S.notifRead = NOTES.every(n => n.is_read);
}
function applyProfile(p) {
  SIN = clean(p.sin || "");
  USERNAME = p.username || "";
  CURRENT_SCHOOL = p.current_school_name || "Not enrolled at a school yet";
  TWO_STEP = !!p.two_step_enabled;
  Object.assign(S.profile, {
    full_name: p.full_name || "", dob: p.date_of_birth || "", gender: p.gender || "",
    phone: p.phone || "", email: p.email || "", village: p.village || "", sub_county: p.sub_county || "",
    district: p.district || "", guardian_name: p.guardian_name || "", guardian_relation: p.guardian_relation || "",
    guardian_contact: p.guardian_contact || "", photo: p.photo_url || ""
  });
}
function showApp() { document.body.classList.remove("pre-auth"); }
function showAuth() { document.body.classList.add("pre-auth"); renderAuth("signin"); }

async function boot() {
  if (TOKEN) {
    const r = await sbRpc("get_student_profile", { p_token: TOKEN });
    if (r && r.success && r.must_change_password) { forcedChange = { temp: "" }; showAuth(); return; }
    if (r && r.success) {
      applyProfile(r);
      await loadAll();
      apply(); chrome(); render();
      showApp();
      return;
    }
    setToken("");
  }
  showAuth();
}

function renderAuth() {
  const el = $("#authScreen"); if (!el) return;
  el.innerHTML = authScreenHTML();
  const f = el.querySelector("#au-totp, #fc-new"); if (f) setTimeout(() => f.focus(), 30);
}
async function finishSignIn(r, pw) {
  setToken(r.token);
  const prof = await sbRpc("get_student_profile", { p_token: TOKEN });
  if (prof && prof.success && prof.must_change_password) {
    pendingLogin = null; forcedChange = { temp: pw || "" }; authErr = ""; renderAuth(); return;
  }
  if (prof && prof.success) applyProfile(prof);
  await loadAll();
  apply(); chrome(); render();
  showApp();
}
async function doSignIn() {
  const id = ($("#au-id").value || "").trim(), pw = $("#au-pw").value || "";
  if (!id || !pw) { authErr = "Enter your SIN or username, and your password."; renderAuth(); return; }
  authBusy = true; authErr = ""; renderAuth();
  const r = await sbRpc("student_login", { p_identifier: id, p_password: pw, p_device: deviceLabel() });
  authBusy = false;
  if (!r || !r.success) {
    if (r && r.needs_totp) { pendingLogin = { identifier: id, password: pw, totp: null, stage: "totp" }; authErr = ""; renderAuth(); return; }
    if (r && r.needs_confirm) { pendingLogin = { identifier: id, password: pw, totp: null, stage: "confirm" }; authErr = ""; renderAuth(); return; }
    authErr = (r && r.error) || "Sign in failed."; renderAuth(); return;
  }
  await finishSignIn(r, pw);
}
async function doTotpSubmit() {
  if (!pendingLogin) return;
  const code = (($("#au-totp") || {}).value || "").replace(/\s/g, "");
  if (!/^\d{6}$/.test(code)) { authErr = "Enter the 6-digit code."; renderAuth(); return; }
  authBusy = true; authErr = ""; renderAuth();
  const r = await sbRpc("student_login", { p_identifier: pendingLogin.identifier, p_password: pendingLogin.password, p_totp: code, p_device: deviceLabel() });
  authBusy = false;
  if (!r || !r.success) {
    if (r && r.needs_confirm) { pendingLogin.totp = code; pendingLogin.stage = "confirm"; authErr = ""; renderAuth(); return; }
    if (r && r.locked) { pendingLogin = null; }
    authErr = (r && r.error) || "Sign in failed."; renderAuth(); return;
  }
  const pw = pendingLogin.password; pendingLogin = null;
  await finishSignIn(r, pw);
}
async function doConfirmLogoutOthers() {
  if (!pendingLogin) return;
  authBusy = true; authErr = ""; renderAuth();
  const r = await sbRpc("student_login", { p_identifier: pendingLogin.identifier, p_password: pendingLogin.password, p_confirm_logout_others: true, p_totp: pendingLogin.totp, p_device: deviceLabel() });
  authBusy = false;
  if (!r || !r.success) {
    if (r && r.needs_totp) { pendingLogin.stage = "totp"; pendingLogin.totp = null; authErr = "That code expired. Enter a fresh one."; renderAuth(); return; }
    if (r && r.locked) { pendingLogin = null; }

function trend(vals, labels) {
  const W = 320, H = 132, px = 34, py = 24, base = H - 26;
  const mn = Math.min(...vals) - 6, mx = Math.max(...vals) + 3;
  const pts = vals.map((v, i) => [px + i * (W - 2 * px) / (vals.length - 1), base - (v - mn) / (mx - mn) * (base - py)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${base} L${pts[0][0].toFixed(1)} ${base} Z`;
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average score by term: ${vals.join(", ")} percent">
    <path d="${area}" fill="var(--primary)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>
    <text x="${p[0].toFixed(1)}" y="${(p[1] - 11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">${vals[i]}%</text>
    <text x="${p[0].toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[i]}</text>`).join("")}
  </svg>`;
}

function fld(f) {
  const [k, l, t, o, ro] = f, v = S.profile[k] || "";
  if (ro && editing) return `<div class="field"><label>${l}</label><div class="val">${v ? esc(v) : "Not set"}</div><small class="sm">Locked — request a correction to change this.</small></div>`;
  if (!editing || ro) return `<div class="field"><label>${l}</label><div class="val">${v ? esc(v) : "Not set"}</div></div>`;
  if (t === "select") return `<div class="field"><label for="pf-${k}">${l}</label><select class="input" id="pf-${k}" data-pf="${k}">${o.map(x => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
  return `<div class="field"><label for="pf-${k}">${l}</label><input class="input" id="pf-${k}" data-pf="${k}" type="${t || "text"}" value="${esc(v)}"></div>`;
}

const recRows = q => {
  const r = resultsAsRows().filter(s => s[0].toLowerCase().includes(q.trim().toLowerCase()));
  if (!RESULTS.length) return `<tr><td colspan="5"><div class="empty">No results have been recorded yet.</div></td></tr>`;
  return r.length
    ? r.map((s, i) => { const src = RESULTS.filter(x => x.subject_name === s[0])[0] || {}; return `<tr><td><b>${esc(s[0])}</b></td><td>${esc(src.term_name || "—")}</td><td>${s[1]}%</td><td>${esc(src.remarks || "—")}</td><td><span class="badge">Recorded</span></td></tr>`; }).join("")
    : `<tr><td colspan="5"><div class="empty">No subject matches “${esc(q)}”. Try a shorter name.</div></td></tr>`;
};

function sessionsHTML() {
  if (SESSIONS === null) return `<div class="empty">Loading…</div>`;
  if (!SESSIONS.length) return `<div class="empty">No active sign-ins.</div>`;
  return SESSIONS.map(x => `<div class="row"><div class="row-ico">${ic("device")}</div><div class="row-main"><b>${esc(x.device || "Unknown device")}${x.is_current ? " · This device" : ""}</b><small>Signed in ${esc(relTime(x.created_at))} · last active ${esc(relTime(x.last_seen_at))}</small></div>${x.is_current ? `<span class="badge">Active</span>` : `<button class="btn ghost sm" data-act="revoke-session" data-id="${esc(x.id)}">Log out</button>`}</div>`).join("");
}
async function loadSessions() {
  if (sessLoading) return;
  sessLoading = true;
  const r = await sbRpc("list_student_sessions", { p_token: TOKEN });
  sessLoading = false;
  SESSIONS = (r && r.success && r.sessions) || [];
  if (cur === "security") render(true);
}

    a.classList.toggle("active", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $$("#bottomNav a").forEach(a => {
    const on = a.getAttribute("href") === "#" + cur;
    a.classList.toggle("active", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const more = $("#bnMore");
  if (more) more.classList.toggle("active", !NAV_BOTTOM.includes(cur));
}

let cur = "dashboard";
const route = () => { const p = location.hash.slice(1); return PAGES[p] ? p : "dashboard"; };
function render(keepScroll) {
  cur = route();
  if (cur !== "security") SESSIONS = null;
  $("#content").innerHTML = PAGES[cur].r();
  if (cur === "security" && SESSIONS === null) loadSessions();
  $("#crumb").innerHTML = `<span>Digital Students</span>${ic("chev")}<b>${PAGES[cur].t}</b>`;
  document.title = PAGES[cur].t + " | Digital Students";
  markActive();
  if (!keepScroll) window.scrollTo(0, 0);
  closeSidebar();
  setTimeout(syncOverlay, 0);
}
function go(p) {
  closeSidebar();
  if (location.hash === "#" + p) { render(); return; }
  if (ovOpen) { ovOpen = false; editing = false; history.replaceState(null, "", "#" + p); render(); }
  else location.hash = p;
}
window.addEventListener("hashchange", () => {
  if (ovOpen) { ovOpen = false; closeModal(); closeSidebar(); }
  editing = false; render();
});

let ovOpen = false;
const overlayVisible = () => $("#scrim").classList.contains("open") || $("#sidebar").classList.contains("open") || editing;
function syncOverlay() {
  const v = overlayVisible();
  if (v && !ovOpen) { history.pushState({ overlay: true }, ""); ovOpen = true; }
  else if (!v && ovOpen) { ovOpen = false; history.back(); }
}
window.addEventListener("popstate", () => {
  if (!ovOpen) { if (history.state && history.state.overlay) history.back(); return; }
  ovOpen = false;
  const wasEditing = editing;
  closeModal(); closeSidebar(); editing = false;
  if (wasEditing) render(true);
});
const closeSidebar = () => { $("#sidebar").classList.remove("open"); $("#sideScrim").classList.remove("open"); };
function commit() { save(); apply(); render(true); chrome(); refreshPops(); }

const PAL = () => [
  ...Object.entries(PAGES).map(([id, p]) => ({ label: p.t, icon: p.i, run: () => go(id) })),
  { label: isDark() ? "Switch to light mode" : "Switch to dark mode", icon: isDark() ? "sun" : "moon", run: () => { S.mode = isDark() ? "light" : "dark"; commit(); } },
  { label: "Change theme color", icon: "palette", run: () => { tab = "appearance"; go("settings"); } },
  { label: S.nav === "bottom" ? "Use sidebar navigation" : "Use bottom navigation", icon: "menu", run: () => { S.nav = S.nav === "bottom" ? "sidebar" : "bottom"; commit(); } }
];
function openPalette() {
  modalOk = null; popId = null;
  box().className = "modal";
  $("#modalBox").innerHTML = `<input class="input" id="palQ" aria-label="Search pages and settings" autocomplete="off"><div class="pal-list" id="palList"></div>`;
  $("#scrim").classList.add("open");
  fillPalette("");
  setTimeout(() => $("#palQ").focus(), 30);
}
function fillPalette(q) {
  const items = PAL().filter(x => x.label.toLowerCase().includes(q.trim().toLowerCase()));
  window._pal = items;
  $("#palList").innerHTML = items.length
    ? items.map((x, i) => `<button class="pal-item ${i === 0 ? "first" : ""}" data-act="pal" data-i="${i}">${ic(x.icon)}${x.label}</button>`).join("")
    : `<div class="empty">Nothing matches “${esc(q)}”. Try “profile” or “dark”.</div>`;
}

function askPassword() {
  modal("Change password", PW_HINT, `
    <div class="field"><label for="m1">Current password</label><input class="input" id="m1" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="m2">New password</label><input class="input" id="m2" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="m3">Confirm new password</label><input class="input" id="m3" type="password" autocomplete="new-password"></div>`, "Update password", () => {
    const a = $("#m1").value, b = $("#m2").value, c = $("#m3").value;
    if (!a) { notify("Enter your current password."); return false; }
    if (!strongPw(b)) { notify(PW_HINT); return false; }
    if (b !== c) { notify("The new passwords don't match."); return false; }
    sbRpc("change_student_password", { p_token: TOKEN, p_old_password: a, p_new_password: b })
      .then(r => notify(r && r.success ? "Password updated" : ((r && r.error) || "Could not update password")));
  });
}
function askGrantSchool() {
  let schoolMap = {}, timer;
  modal("Give a school access", "The school can read your SIN record straight away. You can revoke it any time.", `<div class="field"><label for="m1">School name</label><input class="input" id="m1" list="schoolList" autocomplete="off"><datalist id="schoolList"></datalist></div>`, "Give access", () => {
    const v = $("#m1").value.trim();
    if (!v) { notify("Enter a school name."); return false; }
    if (!schoolMap[v]) { notify("Pick your school from the suggestions."); return false; }
    sbRpc("student_grant_school_access", { p_token: TOKEN, p_school_id: schoolMap[v] })
      .then(async r => {
        if (r && r.success) { notify("Access given to " + (r.school_name || v)); await loadAll(); render(true); }
        else notify((r && r.error) || "Could not give access");
      });
  });
  const inp = $("#m1");
  if (inp) inp.addEventListener("input", () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if (q.length < 3) return;
    timer = setTimeout(async () => {
      const r = await sbRpc("search_schools_for_student", { p_token: TOKEN, p_query: q });
      if (!(r && r.success && Array.isArray(r.schools))) return;
      schoolMap = {};
      $("#schoolList").innerHTML = r.schools.map(x => { const lb = x.name + (x.district ? " (" + x.district + ")" : ""); schoolMap[lb] = x.id; return `<option value="${esc(lb)}"></option>`; }).join("");
    }, 250);
  });
}
function askSelfLock(lock) {
  modal(lock ? "Lock your SIN?" : "Unlock your SIN?",
    lock ? "Mother’s transfer windows will not be able to open your SIN to a new school. Schools you already gave access to keep it until you revoke them."
         : "Mother will be able to open a transfer window for a school you are moving to.",
    "", lock ? "Lock my SIN" : "Unlock", () => {
    sbRpc("student_set_self_lock", { p_token: TOKEN, p_locked: !!lock }).then(async r => {
      if (r && r.success) { notify(lock ? "Your SIN is locked" : "Your SIN is unlocked"); await loadAll(); render(true); }
      else notify((r && r.error) || "Could not change the lock");
    });
  }, !!lock);
}
function askNewApp() {
  modal("New application", "Choose what you want to request.", `<div class="field"><label for="m1">Request type</label><select class="input" id="m1">
    <option value="registration">Academic record request</option>
    <option value="class_change">Class change</option>
    <option value="transfer">Transfer certificate</option></select></div>
    <div class="field"><label for="m2">Notes (optional)</label><input class="input" id="m2"></div>`, "Submit application", () => {
    const kind = $("#m1").value, notes = $("#m2").value.trim();
    sbRpc("submit_student_application", { p_token: TOKEN, p_kind: kind, p_notes: notes || null })
      .then(async r => {
        if (r && r.success) { notify("Application submitted"); await loadAll(); render(true); }
        else notify((r && r.error) || "Could not submit application");
      });
  });
}
const CORRECTION_FIELDS = [
  ["full_name", "Full name"], ["dob", "Date of birth", "date"], ["gender", "Gender", "gender"],
  ["village", "Village"], ["sub_county", "Sub-county"], ["district", "District"],
  ["guardian_name", "Guardian name"], ["guardian_relation", "Relationship"], ["guardian_contact", "Guardian phone"]
];
const CORRECTION_KEY = { dob: "date_of_birth" }; // profile field name -> student_identities column
function askCorrection() {
  const inputs = CORRECTION_FIELDS.map(([k, label, type]) => {
    const v = S.profile[k] || "";
    if (type === "gender") return `<div class="field"><label>${label}</label><select id="c_${k}">${["Male", "Female"].map(g => `<option ${v === g ? "selected" : ""}>${g}</option>`).join("")}</select></div>`;
    return `<div class="field"><label>${label}</label><input id="c_${k}" type="${type || "text"}" value="${esc(v)}"></div>`;
  }).join("");
  modal("Request correction", `<p class="sm" style="margin-bottom:10px">Change only what is wrong. Mother reviews the request; nothing changes until it's approved. Only one request can be open at a time.</p>${inputs}<div class="field"><label for="c_reason">Why is this correction needed?</label><input class="input" id="c_reason"></div>`, "Send to Mother", () => {
    const changes = {};
    CORRECTION_FIELDS.forEach(([k]) => {
      const now = ($("#c_" + k).value || "").trim(), col = CORRECTION_KEY[k] || k;
      if (now !== String(S.profile[k] || "").trim()) changes[col] = now || null;
    });
    const reason = $("#c_reason").value.trim();
    if (!Object.keys(changes).length) { notify("Change at least one detail first."); return false; }
    if (!reason) { notify("Give a reason for the correction."); return false; }
    sbRpc("student_submit_correction", { p_token: TOKEN, p_changes: changes, p_reason: reason })
      .then(r => { if (r && r.success) notify("Correction " + (r.ref || "") + " sent to Mother"); else notify((r && r.error) || "Could not submit correction"); });
  });
}
function askReset() {
  modal("Reset preferences?", "Appearance, notifications and privacy go back to their defaults. Your profile and records are not changed.", "", "Reset preferences", () => {
    ["mode", "theme", "corner", "density", "text", "sidebar", "nav", "dateFmt", "notif", "channel", "privacy"].forEach(k => { S[k] = structuredClone(DEF[k]); });
    commit(); notify("Preferences reset");
  }, true);
}
function doRevokeAuth(id) {
  sbRpc("revoke_student_authorization", { p_token: TOKEN, p_id: id }).then(async r => {
    if (r && r.success) { notify("Access revoked"); await loadAll(); render(true); }
    else notify((r && r.error) || "Could not revoke authorization");
  });
}

async function ask2faSetup() {
  const r = await sbRpc("student_2fa_begin", { p_token: TOKEN });
  if (!r || !r.success) { notify((r && r.error) || "Could not start setup"); return; }
  const key = String(r.secret).match(/.{1,4}/g).join(" ");
  modal("Set up two-step verification", "Use an authenticator app such as Google Authenticator, Microsoft Authenticator or Authy.", `
    <p class="sm" style="margin-bottom:10px">1. In your app choose “Enter a setup key” and type this key, or <a href="${esc(r.otpauth_uri)}" style="text-decoration:underline">open it in your authenticator app</a> on this phone.</p>
    <div class="id-inline" style="margin-bottom:12px"><div class="mono" style="letter-spacing:.06em;word-break:break-all">${esc(key)}</div><button class="btn soft sm" data-act="copy-2fa" data-val="${esc(r.secret)}">${ic("copy")}Copy</button></div>
    <p class="sm" style="margin-bottom:10px">2. Enter the 6-digit code your app shows.</p>
    <div class="field"><label for="m1">6-digit code</label><input class="input" id="m1" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>`, "Turn on", () => {
    const code = ($("#m1").value || "").replace(/\s/g, "");
    if (!/^\d{6}$/.test(code)) { notify("Enter the 6-digit code."); return false; }
    sbRpc("student_2fa_enable", { p_token: TOKEN, p_code: code }).then(r2 => {
      if (r2 && r2.success) { TWO_STEP = true; closeModal(); notify("Two-step verification is on"); render(true); }
      else notify((r2 && r2.error) || "Could not turn it on");
    });
    return false;
  });
}
function ask2faOff() {
  modal("Turn off two-step verification?", "Confirm with your password and a current code from your app.", `
    <div class="field"><label for="m0">Password</label><input class="input" id="m0" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="m1">6-digit code</label><input class="input" id="m1" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>`, "Turn off", () => {
    const pw = $("#m0").value, code = ($("#m1").value || "").replace(/\s/g, "");
    if (!pw) { notify("Enter your password."); return false; }
    if (!/^\d{6}$/.test(code)) { notify("Enter the 6-digit code."); return false; }
    sbRpc("student_2fa_disable", { p_token: TOKEN, p_password: pw, p_code: code }).then(r => {
      if (r && r.success) { TWO_STEP = false; closeModal(); notify("Two-step verification is off"); render(true); }
      else notify((r && r.error) || "Could not turn it off");
    });
    return false;
  }, true);
}
async function doExport() {
  notify("Preparing your download…");
  const r = await sbRpc("export_student_data", { p_token: TOKEN });
  if (!r || !r.success) { notify((r && r.error) || "Could not prepare your data"); return; }
  const { success, ...data } = r;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = "digital-students-" + (SIN || "data") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  notify("Your data was downloaded");
}

function readPhoto(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { notify("Choose an image file."); return; }
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const n = 256, c = document.createElement("canvas"); c.width = c.height = n;
    const s = Math.min(img.width, img.height), ctx = c.getContext("2d");
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
    S.profile.photo = c.toDataURL("image/jpeg", .85);
    URL.revokeObjectURL(url); chrome(); render(true);
    persistProfile().then(ok => notify(ok ? "Photo updated" : "Photo preview saved, but syncing failed"));
  };
  img.onerror = () => { URL.revokeObjectURL(url); notify("That image couldn't be read."); };
  img.src = url;
}
async function persistProfile() {
  const p = S.profile;
  const r = await sbRpc("update_student_contact_info", {
    p_token: TOKEN, p_phone: p.phone, p_email: p.email, p_photo_url: p.photo
  });
  return !!(r && r.success);
}

document.addEventListener("click", e => {
  if (e.target === $("#scrim")) { closeModal(); return; }
  const link = e.target.closest("a.nav-item,a.bn-item");
  if (link) { e.preventDefault(); go(link.getAttribute("href").slice(1)); return; }
  const el = e.target.closest("[data-act],[data-go]");
  if (!el) return;
  if (el.dataset.go) { closeModal(); go(el.dataset.go); return; }
  const d = el.dataset;
  switch (d.act) {
    case "popup": openPopup(d.id); break;
    case "menu": $("#sidebar").classList.add("open"); $("#sideScrim").classList.add("open"); break;
    case "theme": S.theme = d.v; commit(); break;
    case "set": S[d.k] = d.k === "text" ? +d.v : d.v; commit(); break;
    case "toggle": setp(d.path, !getp(d.path)); commit(); notify("Preference saved"); break;
    case "tab": tab = d.v; render(true); break;
    case "copy":
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(d.val).then(() => notify("Student number copied"), () => notify("Copy isn't available here. Select the number instead."));
      else notify("Copy isn't available here. Select the number instead.");
      break;
    case "edit-profile": editing = true; render(true); break;
    case "cancel-profile": editing = false; render(true); break;
    case "save-profile": {
      const next = {};
      $$("[data-pf]").forEach(i => { next[i.dataset.pf] = i.value.trim(); });
      if (next.email && !/^\S+@\S+\.\S+$/.test(next.email)) { notify("Enter a valid email address."); break; }
      Object.assign(S.profile, next); editing = false; chrome(); render(true);
      persistProfile().then(ok => notify(ok ? "Profile saved" : "Could not save profile"));
      break;
    }
    case "remove-photo": S.profile.photo = ""; chrome(); render(true); persistProfile().then(ok => notify(ok ? "Photo removed" : "Could not remove photo")); break;
    case "mark-read": sbRpc("mark_student_notifications_read", { p_token: TOKEN }).then(async () => { await loadAll(); chrome(); refreshPops(); }); break;
    case "revoke-auth": doRevokeAuth(d.id); break;
    case "reset": askReset(); break;
    case "palette": openPalette(); break;
    case "pal": { const it = window._pal[+d.i]; closeModal(); if (it) it.run(); break; }
    case "logout": modal("Log out?", "You'll need your student number and password to sign back in.", "", "Log out", () => {
      sbRpc("revoke_student_session", { p_token: TOKEN }).finally(() => { setToken(""); location.reload(); });
    }, true); break;
    case "authorize": case "transfer": askGrantSchool(); break;
    case "self-lock": askSelfLock(d.lock === "1"); break;
    case "pw": askPassword(); break;
    case "new-app": askNewApp(); break;
    case "request-correction": askCorrection(); break;
    case "auth-tab": authMode = d.v; authErr = ""; recoverySent = ""; pendingLogin = null; renderAuth(); break;
    case "auth-signin": doSignIn(); break;
    case "auth-signup": doSignUp(); break;
    case "auth-forgot": doForgotPassword(); break;
    case "auth-confirm-logout": doConfirmLogoutOthers(); break;
    case "auth-cancel-confirm": cancelPendingLogin(); break;
    case "signout-others": sbRpc("revoke_other_student_sessions", { p_token: TOKEN }).then(r => {
      if (r && r.success) { notify(r.revoked ? "Logged out " + r.revoked + " other device" + (r.revoked > 1 ? "s" : "") : "No other devices were signed in"); SESSIONS = null; if (cur === "security") render(true); }
      else notify((r && r.error) || "Could not log out other devices");
    }); break;
    case "revoke-session": sbRpc("revoke_student_session_by_id", { p_token: TOKEN, p_session_id: d.id }).then(r => {
      if (r && r.success) { notify("Device logged out"); SESSIONS = null; if (cur === "security") render(true); }
      else notify((r && r.error) || "Could not log out that device");
    }); break;
    case "2fa-on": ask2faSetup(); break;
    case "2fa-off": ask2faOff(); break;
    case "copy-2fa":
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(d.val).then(() => notify("Setup key copied"), () => notify("Copy isn't available here. Select the key instead."));
      else notify("Copy isn't available here. Select the key instead.");
      break;
    case "download": doExport(); break;
    case "auth-totp": doTotpSubmit(); break;
    case "auth-forced": doForcedChange(); break;
    case "auth-forced-cancel": cancelForcedChange(); break;
    case "contact": notify("Support request opened"); break;
    case "modal-ok": if (!modalOk || modalOk() !== false) closeModal(); break;
    case "modal-close": closeModal(); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "recQ") $("#recBody").innerHTML = recRows(t.value);
  else if (t.id === "textRange") { S.text = +t.value; apply(); $("#textVal").textContent = S.text + "%"; }
  else if (t.id === "palQ") fillPalette(t.value);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "textRange") { save(); }
  else if (t.id === "photoInput") readPhoto(t.files[0]);
  else if (t.dataset.sel) { S[t.dataset.sel] = t.value; commit(); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") { closeModal(); closeSidebar(); return; }
  if (e.key === "Enter" && e.target.closest("#authScreen")) {
    e.preventDefault();
    if (forcedChange) doForcedChange();
    else if (pendingLogin) { if (pendingLogin.stage === "totp") doTotpSubmit(); else doConfirmLogoutOthers(); }
    else if (authMode === "forgot") doForgotPassword();
    else if (authMode === "signin") doSignIn();
    else doSignUp();
    return;
  }
  if (e.key === "Enter" && $("#scrim").classList.contains("open")) {
    if (e.target.id === "palQ") { const it = (window._pal || [])[0]; if (it) { closeModal(); it.run(); } }
    else if (modalOk && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { if (modalOk() !== false) closeModal(); }
  }
});
$("#sideScrim").addEventListener("click", closeSidebar);

["click", "keydown", "change"].forEach(t => document.addEventListener(t, () => setTimeout(syncOverlay, 0)));

if (history.state && history.state.overlay) history.replaceState(null, "");
$$("[data-ic]").forEach(el => { el.innerHTML = ic(el.dataset.ic); });
apply();
boot();

// ---------- Installable PWA: service worker + install prompt ----------
if ("serviceWorker" in navigator) {
  const swSource = `
    const SHELL_CACHE = "digital-students-shell-v1";
    self.addEventListener("install", (e) => {
      self.skipWaiting();
    });
    self.addEventListener("activate", (e) => {
      self.clients.claim();
      e.waitUntil(
        caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== SHELL_CACHE).map((k) => caches.delete(k))))
      );
    });
    self.addEventListener("fetch", (e) => {
      const req = e.request;
      if (req.method !== "GET") return; // never intercept writes
      let url;
      try { url = new URL(req.url); } catch (err) { return; }
      if (url.origin !== self.location.origin) return; // never touch cross-origin API calls
      e.respondWith(
        fetch(req).then((res) => {
          const copy = res.clone();
          caches.open(SHELL_CACHE).then((cache) => cache.put(req, copy)).catch(() => {});
          return res;
        }).catch(() => caches.match(req))
      );
    });
  `;
  const swBlob = new Blob([swSource], { type: "application/javascript" });
  const swUrl = URL.createObjectURL(swBlob);
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(swUrl, { scope: "/" }).catch((err) => console.warn("SW registration failed:", err));
  });
}
